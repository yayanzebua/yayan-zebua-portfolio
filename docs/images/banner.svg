<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121324"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>

    <!-- Crimson Accent Glow -->
    <radialGradient id="glowCrimson" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f13024" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#f13024" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f13024" stop-opacity="0"/>
    </radialGradient>

    <!-- Indigo Violet Glow -->
    <radialGradient id="glowIndigo" cx="85%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#312e81" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.035"/>
    </pattern>

    <!-- Border Linear Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="30%" stop-color="#f13024" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: 2px; }
    .subtitle { font-weight: 500; letter-spacing: 4px; }
    .tagline { font-weight: 300; letter-spacing: 0.5px; }
    .pill-text { font-weight: 600; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }
    .chip-text { font-weight: 500; font-size: 12px; letter-spacing: 0.5px; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="380" rx="16" fill="url(#glowCrimson)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glowIndigo)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- Outer Elegant Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Decorative Modern Accents -->
  <circle cx="1060" cy="90" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  <circle cx="1060" cy="90" r="90" fill="none" stroke="#f13024" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="1060" cy="90" r="40" fill="none" stroke="#6366f1" stroke-opacity="0.12" stroke-dasharray="3 4" stroke-width="1.5"/>
  <circle cx="120" cy="300" r="80" fill="none" stroke="#f13024" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Top Status / Role Kicker Badge -->
  <g transform="translate(600, 72)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="-136" cy="0" r="4" fill="#f13024"/>
    <text class="font-sans pill-text" x="6" y="4" text-anchor="middle" fill="#fca5a5">FULL STACK DEVELOPER • PORTFOLIO</text>
  </g>

  <!-- Main Name Header -->
  <text class="font-sans title" x="600" y="162" text-anchor="middle" font-size="54" fill="url(#textGrad)">
    YAYAN ZEBUA
  </text>

  <!-- Subtitle -->
  <text class="font-sans subtitle" x="600" y="206" text-anchor="middle" font-size="16" fill="#cbd5e1">
    PERSONAL PORTFOLIO WEBSITE
  </text>

  <!-- Tagline -->
  <text class="font-sans tagline" x="600" y="246" text-anchor="middle" font-size="15" fill="#94a3b8">
    Engineering Scalable Web Architectures, Interactive Systems &amp; Digital Experiences
  </text>

  <!-- Decorative Separator Line -->
  <line x1="450" y1="272" x2="750" y2="272" stroke="url(#borderGlow)" stroke-width="1" stroke-linecap="round"/>

  <!-- Tech Stack Chips Bar -->
  <g transform="translate(600, 314)">
    <!-- Chip 1: Next.js 16 -->
    <rect x="-370" y="-14" width="110" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text class="font-sans chip-text" x="-315" y="4" text-anchor="middle" fill="#e2e8f0">Next.js 16</text>

    <!-- Chip 2: React 19 -->
    <rect x="-245" y="-14" width="100" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text class="font-sans chip-text" x="-195" y="4" text-anchor="middle" fill="#e2e8f0">React 19</text>

    <!-- Chip 3: TypeScript -->
    <rect x="-130" y="-14" width="115" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text class="font-sans chip-text" x="-72" y="4" text-anchor="middle" fill="#e2e8f0">TypeScript</text>

    <!-- Chip 4: Tailwind v4 -->
    <rect x="0" y="-14" width="130" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text class="font-sans chip-text" x="65" y="4" text-anchor="middle" fill="#e2e8f0">Tailwind CSS v4</text>

    <!-- Chip 5: Framer Motion -->
    <rect x="145" y="-14" width="125" height="28" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text class="font-sans chip-text" x="207" y="4" text-anchor="middle" fill="#e2e8f0">Framer Motion</text>

    <!-- Chip 6: Vercel Ready -->
    <rect x="285" y="-14" width="105" height="28" rx="6" fill="#f13024" fill-opacity="0.12" stroke="#f13024" stroke-opacity="0.4" stroke-width="1"/>
    <text class="font-sans chip-text" x="337" y="4" text-anchor="middle" fill="#fca5a5">Vercel Ready</text>
  </g>
</svg>

